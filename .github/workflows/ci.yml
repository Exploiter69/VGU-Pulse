name: Pulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run check
      - name: Worker dry run
        run: npx wrangler deploy --dry-run --outdir .ci-dist
      - name: Web JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web/index.html", "utf8");
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
          if (!scripts.length) throw new Error("No inline script found");
          for (const source of scripts) new Function(source);
          for (const file of ["web/community-v2.js"]) new Function(fs.readFileSync(file, "utf8"));
          console.log("web scripts: syntax ok");
          NODE
      - name: Static production guards
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web/index.html", "utf8");
          const ids = [...html.matchAll(/id=["']([^"']+)["']/g)].map((m) => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error("Duplicate IDs: " + [...new Set(duplicates)].join(", "));
          if (/\bconfirm\s*\(/.test(html)) throw new Error("Native confirm() is forbidden in the Telegram Mini App");
          if (/redis|kafka|celery|r2/i.test(fs.readFileSync("wrangler.jsonc", "utf8"))) throw new Error("Paid/forbidden infrastructure reference found");
          if (!html.includes("safeAreaChanged") || !html.includes("contentSafeAreaChanged")) throw new Error("Telegram safe-area handlers missing");
          if (!html.includes("const navigationStack")) throw new Error("Telegram navigation history missing");
          console.log("production guards: ok");
          NODE
      - name: Tests
        run: npm test

name: Pulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run check
      - name: Worker dry run
        run: npx wrangler deploy --dry-run --outdir .ci-dist
      - name: Web JavaScript syntax
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('web/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]); if(!scripts.length) throw new Error('No inline script found'); for(const source of scripts) new Function(source); console.log('web scripts:',scripts.length,'syntax ok')"
      - name: Tests
        run: npm test
